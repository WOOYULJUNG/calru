[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calru-paper"
version = "0.1.0"
description = "Auditable evidence aggregation for the CA-LRU paper"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

# License and author metadata are intentionally omitted until publication and
# double-blind requirements have been resolved.

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
topology-analysis = [
  "ripser==0.6.15",
]

[project.scripts]
calru-build-evidence = "calru_paper.evidence:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["calru_paper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
