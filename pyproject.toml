[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rplru"
version = "0.1.0"
description = "Minimal reproduction code for Retention Plasticity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy==1.26.4",
  "torch==2.4.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
rplru-train = "rplru.train:main"
rplru-eval = "rplru.evaluate:main"
rplru-geometry = "rplru.geometry:main"
rplru-spatial-train = "rplru.spatial:main"
rplru-spatial-eval = "rplru.evaluate_spatial:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rplru = ["protocol.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
